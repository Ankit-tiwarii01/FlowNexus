name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flownexus
          POSTGRES_PASSWORD: flownexus
          POSTGRES_DB: flownexus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flownexus -d flownexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://flownexus:flownexus@localhost:5432/flownexus_test?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      CLIENT_URL: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
